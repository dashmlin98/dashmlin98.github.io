<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Number Display</title>
<style>
  body {
    background-color: white;
    color: black;
    font-family: sans-serif;
    font-size: 24px;
    text-align: center;
    margin-top: 50px;
  }
  button {
    font-size: 18px;
    margin: 5px;
    padding: 10px 20px;
  }
</style>
</head>
<body>

<div id="numberDisplay">0</div>
<button onclick="setSpeed(0.5)">Speed 0.5x</button>
<button onclick="setSpeed(2)">Speed 2x</button>

<script>
let x = 1;
let n = 0;
let speed = 1;
let duration = 10 * 60 * 1000; // 10 minutes in milliseconds
let startTime = Date.now();

function illis(x, n) {
    if (x <= 1.4) {
        return n;
    } else if (x > 1.4 && x <= 1.5) {
        return `<sup>10</sup>${n}`;
    } else if (x > 1.5 && x <= 1.6) {
        return `<sup>10<sup>0</sup></sup>${n}`;
    } else if (x > 1.6 && x <= 1.7) {
        return `<sup>10<sup>10<sup>0</sup></sup></sup>${n}`;
    } else if (x > 1.7) {
        return `<sup>10<sup>10<sup>10<sup>0</sup></sup></sup></sup>${n}`;
    }
}

function updateNumber() {
    if (Date.now() - startTime >= duration) return;

    const display = document.getElementById('numberDisplay');
    display.innerHTML = illis(x, Math.floor(n));

    n += 1 * speed;
    if (n > 999999) n = 0;

    requestAnimationFrame(updateNumber);
}

function setSpeed(s) {
    speed = s;
}

updateNumber();
</script>

</body>
</html>
